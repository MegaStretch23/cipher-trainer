[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-trainer"
version = "0.1.0"
description = "Break classical ciphers (Caesar, Vigenere, Atbash, affine, substitution, rail fence, columnar) and see every step. Standard library only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
trainer = "cipher_trainer.cli:main"

[tool.setuptools]
packages = ["cipher_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
